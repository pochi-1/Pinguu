<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be available to watch movie?? 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hearts-bg" aria-hidden="true"></div>

    <main class="container">
        <h1>Will you watch movie with me?</h1>
        <div class="gif-container">
            <img id="cat-gif" src="https://media.tenor.com/EBV7OT7ACfwAAAAj/u-u-qua-qua-u-quaa.gif" alt="Cute character">
        </div>

        <div class="buttons">
            <button id="yes-btn" type="button">Yes</button>
            <button id="no-btn" type="button">No</button>
        </div>
        <div id="tease-toast" role="status" aria-live="polite"></div>
    </main>

    <audio id="bg-music" loop preload="auto">
        <source src="Music/beabadoobee - Glue Song (Official Music Video).mp3" type="audio/mpeg">
    </audio>
    <button id="music-toggle" type="button" title="Toggle music" aria-label="Toggle music">🔊</button>

    <!-- The button code is inline so it cannot be blocked by a stale script.js cache. -->
    <script>
        const gifStages = [
            'https://media.tenor.com/EBV7OT7ACfwAAAAj/u-u-qua-qua-u-quaa.gif',
            'https://media1.tenor.com/m/-ozRS87uGPsAAAAC/chiikawa-cute.gif',
            'https://media1.tenor.com/m/yUkZmkWoAV0AAAAC/sad-jigglypuff.gif',
            'https://media.tenor.com/OGY9zdREsVAAAAAj/somsom1012.gif',
            'https://media1.tenor.com/m/IOSVUx97AW4AAAAC/snoopy-sad.gif',
            'https://media.tenor.com/CivArbX7NzQAAAAj/somsom1012.gif',
            'https://media.tenor.com/5_tv1HquZlcAAAAj/chiikawa.gif',
            'https://media1.tenor.com/m/uDugCXK4vI4AAAAC/chiikawa-hachiware.gif'
        ]
        const noMessages = [
            'No', 'Are you positive? 🤔', 'Pookie please... 🥺',
            'If you say no, I will be really sad...', 'I will be very sad... 😢',
            'Please??? 💔', "Don't do this to me...", 'Last chance! 😭'
        ]

        const catGif = document.getElementById('cat-gif')
        const yesBtn = document.getElementById('yes-btn')
        const noBtn = document.getElementById('no-btn')
        const music = document.getElementById('bg-music')
        const musicToggle = document.getElementById('music-toggle')
        let yesClickCount = 0

        // Yes performs the GIF/teasing action.
        yesBtn.addEventListener('click', () => {
            yesClickCount++
            noBtn.textContent = noMessages[Math.min(yesClickCount, noMessages.length - 1)]
            yesBtn.style.fontSize = `${Math.min(25.6 * (1.2 ** yesClickCount), 64)}px`
            yesBtn.style.padding = `${Math.min(18 + yesClickCount * 4, 48)}px ${Math.min(45 + yesClickCount * 8, 100)}px`
            if (yesClickCount >= 2) {
                noBtn.style.fontSize = `${Math.max(16 * (0.85 ** (yesClickCount - 1)), 10)}px`
            }
            catGif.style.opacity = '0'
            setTimeout(() => {
                catGif.src = gifStages[Math.min(yesClickCount, gifStages.length - 1)]
                catGif.style.opacity = '1'
            }, 200)
        })

        // No opens the success page.
        noBtn.addEventListener('click', () => {
            window.location.href = 'yes.html'
        })

        musicToggle.addEventListener('click', async () => {
            if (music.paused) {
                try { await music.play(); musicToggle.textContent = '🔊' }
                catch { musicToggle.textContent = '🔇' }
            } else {
                music.pause()
                musicToggle.textContent = '🔇'
            }
        })
    </script>
</body>
</html>
