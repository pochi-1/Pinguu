<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be available to watch movie?? 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hearts-bg" aria-hidden="true"></div>

    <main class="container">
        <h1>Will you watch movie with me?</h1>
        <div class="gif-container">
            <img id="cat-gif" src="https://media.tenor.com/EBV7OT7ACfwAAAAj/u-u-qua-qua-u-quaa.gif" alt="Cute character">
        </div>

        <div class="buttons">
            <button id="yes-btn" type="button">Yes</button>
            <button id="no-btn" type="button">Yes</button>
        </div>
        <div id="tease-toast" role="status" aria-live="polite"></div>
    </main>

    <audio id="bg-music" loop preload="auto">
        <source src="Music/beabadoobee - Glue Song (Official Music Video).mp3" type="audio/mpeg">
    </audio>
    <button id="music-toggle" type="button" title="Toggle music" aria-label="Toggle music">🔊</button>

    <script src="script.js"></script>
</body>
</html>
